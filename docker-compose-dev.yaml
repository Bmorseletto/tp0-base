name: tp0
services:
   server:
      container_name: server
      image: server:latest
      entrypoint: python3 /main.py
      enviroment:
         - PYTHONUNBUFFERED=1
         - LOGGING_LEVEL=DEBUG
      networks:
         - testing_net
   client1:
      container_name: client1
      image: client:latest
      entrypoint: /client
      enviroment:
         - CLI_ID=1
         - CLI_LOG_LEVEL=DEBUG
      networks:
         - testing_net
      depends_on:
         - server
   client2:
      container_name: client2
      image: client:latest
      entrypoint: /client
      enviroment:
         - CLI_ID=2
         - CLI_LOG_LEVEL=DEBUG
      networks:
         - testing_net
      depends_on:
         - server
networks:
   testing_net:
      ipam:
         dirver: default
         config:
               - subnet: 172.25.125.0/24
