name: tp0
services:
   server:
      container_name: server
      image: server:latest
      entrypoint: python3 /main.py
      environment:
         - PYTHONUNBUFFERED=1
      networks:
         - testing_net
      volumes:
         - ./server/config.ini:/config.ini
   client1:
      container_name: client1
      image: client:latest
      entrypoint: /client
      environment:
         - CLI_ID=1
         - CLI_NAME=client1
         - CLI_LASTNAME=client1erez
         - CLI_DNI=10000001
         - CLI_BIRTHDATE=2000-03-01
         - CLI_NUMBER=1813
      networks:
         - testing_net
      depends_on:
         - server
      volumes:
         - ./client/config.yaml:/config.yaml
         - ./.data/agency-1.csv:/agency-1.csv
networks:
   testing_net:
      ipam:
         driver: default
         config:
               - subnet: 172.25.125.0/24
